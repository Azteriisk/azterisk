<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Deep Space Dark Background Circle -->
  <circle cx="32" cy="32" r="30" fill="#030308" stroke="#38bdf8" stroke-width="2" />
  
  <!-- Subtle Constellation Glow Orbit Ring -->
  <circle cx="32" cy="32" r="23" stroke="#818cf8" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />
  
  <!-- Glowing Center Star Core -->
  <circle cx="32" cy="32" r="5" fill="#38bdf8" />
  <circle cx="32" cy="32" r="2.5" fill="#ffffff" />
  
  <!-- 6-Pointed Asterisk Constellation Rays -->
  <!-- Ray 1 (Top) -->
  <line x1="32" y1="12" x2="32" y2="27" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="32" cy="12" r="3" fill="#38bdf8" />
  
  <!-- Ray 2 (Bottom) -->
  <line x1="32" y1="52" x2="32" y2="37" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="32" cy="52" r="3" fill="#38bdf8" />
  
  <!-- Ray 3 (Top-Right) -->
  <line x1="49.3" y1="22" x2="36.3" y2="29.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="49.3" cy="22" r="3" fill="#818cf8" />
  
  <!-- Ray 4 (Bottom-Left) -->
  <line x1="14.7" y1="42" x2="27.7" y2="34.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="14.7" cy="42" r="3" fill="#818cf8" />
  
  <!-- Ray 5 (Top-Left) -->
  <line x1="14.7" y1="22" x2="27.7" y2="29.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="14.7" cy="22" r="3" fill="#34d399" />
  
  <!-- Ray 6 (Bottom-Right) -->
  <line x1="49.3" y1="42" x2="36.3" y2="34.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="49.3" cy="42" r="3" fill="#34d399" />
</svg>
